{% extends "base.html" %}
{% block title %}Login / Register - Exam Recommender{% endblock %}
{% block content %}
<section class="auth-box">
    <div class="tab-bar" id="authTabs">
        <button type="button" class="tab-btn {{ 'active' if active_tab != 'register' else '' }}" data-tab="loginPanel">Login</button>
        <button type="button" class="tab-btn {{ 'active' if active_tab == 'register' else '' }}" data-tab="registerPanel">Register</button>
    </div>
    <div class="tab-panel {{ 'active' if active_tab != 'register' else '' }}" id="loginPanel">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}" data-validate>
            <div class="form-row"><label for="login_email">Email</label><input type="email" id="login_email" name="email" autocomplete="email" required><small class="error-text"></small></div>
            <div class="form-row"><label for="login_password">Password</label><input type="password" id="login_password" name="password" autocomplete="current-password" required><small class="error-text"></small></div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
    </div>
    <div class="tab-panel {{ 'active' if active_tab == 'register' else '' }}" id="registerPanel">
        <h2>Create your account</h2>
        <form method="POST" action="{{ url_for('register') }}" data-validate>
            <div class="form-row"><label for="name">Full name</label><input type="text" id="name" name="name" minlength="2" maxlength="100" autocomplete="name" required><small class="error-text"></small></div>
            <div class="form-row"><label for="reg_email">Email</label><input type="email" id="reg_email" name="email" autocomplete="email" required><small class="error-text"></small></div>
            <div class="form-grid">
                <div class="form-row"><label for="reg_password">Password</label><input type="password" id="reg_password" name="password" minlength="8" autocomplete="new-password" required><small class="error-text"></small></div>
                <div class="form-row"><label for="confirm_password">Confirm password</label><input type="password" id="confirm_password" data-match="reg_password" required><small class="error-text"></small></div>
            </div>
            <div class="form-grid">
                <div class="form-row"><label for="date_of_birth">Date of birth</label><input type="date" id="date_of_birth" name="date_of_birth" max="{{ today }}" required><small class="error-text"></small></div>
                <div class="form-row"><label for="qualification">Highest qualification</label><select id="qualification" name="qualification" required>
                    <option value="">Select</option><option value="10th">10th</option><option value="12th">12th</option><option value="Diploma/ITI">Diploma / ITI</option><option value="Graduation">Graduation</option><option value="Post-graduation">Post-graduation</option>
                </select><small class="error-text"></small></div>
            </div>
            <div class="form-grid">
                <div class="form-row"><label for="stream">Stream / Field</label><select id="stream" name="stream" required>
                    <option value="">Select</option><option value="Any">Any / Not applicable</option><option value="Arts">Arts</option><option value="Commerce">Commerce</option><option value="Science">Science</option><option value="PCM">PCM</option><option value="PCB">PCB</option><option value="PCMB">PCMB</option><option value="Technical">Technical / ITI</option><option value="Computer Science">Computer Science</option><option value="Civil">Civil</option><option value="Mechanical">Mechanical</option><option value="Electrical">Electrical</option><option value="Other">Other</option>
                </select><small class="error-text"></small></div>
                <div class="form-row"><label for="percentage">Percentage (%) <span class="muted">(optional)</span></label><input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01"><small class="error-text"></small></div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Register</button>
        </form>
    </div>
</section>
{% endblock %}
